version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      exporters:
        patterns:
          - "*"
